namespace: banking-prod

images:
  userService: "716969407191.dkr.ecr.eu-west-2.amazonaws.com/bank-user-service"
  transactionService: "716969407191.dkr.ecr.eu-west-2.amazonaws.com/bank-transaction-service"
  activityService: "716969407191.dkr.ecr.eu-west-2.amazonaws.com/bank-activity-service"
  frontend: "716969407191.dkr.ecr.eu-west-2.amazonaws.com/bank-frontend"
  tag: "35940a809dfb3f9c2e2c87d56e747f34c9929f4d"

ingress:
  host: bank.creativity-is-wealth.co.uk
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: replace-with-prod-acm-certificate-arn
    alb.ingress.kubernetes.io/auth-type: cognito
    alb.ingress.kubernetes.io/auth-idp-cognito: replace-with-terraform-cognito-alb-json
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/load-balancer-attributes: deletion_protection.enabled=true

externalSecrets:
  awsSecretPath: replace-with-terraform-rds-secret-arn
  databaseHost: replace-with-terraform-rds-endpoint
  databasePort: 5432

config:
  frontendOrigins: https://bank.creativity-is-wealth.co.uk
  springJpaHibernateDdlAuto: validate
replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 60

observability:
  datadog:
    enabled: true
    environment: prod

databaseMigration:
  enabled: true
  image: postgres:16-alpine

frontendConfig:
  userApiUrl: /api/usersvc
  transactionApiUrl: /api/txsvc
  activityApiUrl: /api/activitysvc