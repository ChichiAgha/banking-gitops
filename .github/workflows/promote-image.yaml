name: promote-production

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: Full Git commit SHA already deployed and validated in dev
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate and update production release
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          IMAGE_TAG: ${{ inputs.imageTag }}
        run: |
          [[ "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]] || { echo "imageTag must be a full 40-character Git SHA"; exit 1; }
          test -n "${ECR_REGISTRY}" || { echo "ECR_REGISTRY repository variable is required"; exit 1; }
          FILE="environments/prod/values.yaml"
          sed -i "s|^  userService:.*|  userService: \"${ECR_REGISTRY}/bank-user-service\"|" "${FILE}"
          sed -i "s|^  transactionService:.*|  transactionService: \"${ECR_REGISTRY}/bank-transaction-service\"|" "${FILE}"
          sed -i "s|^  activityService:.*|  activityService: \"${ECR_REGISTRY}/bank-activity-service\"|" "${FILE}"
          sed -i "s|^  frontend:.*|  frontend: \"${ECR_REGISTRY}/bank-frontend\"|" "${FILE}"
          sed -i "s|^  tag:.*|  tag: \"${IMAGE_TAG}\"|" "${FILE}"

      - name: Open production promotion pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/prod-${{ inputs.imageTag }}
          delete-branch: true
          commit-message: "promote(prod): ${{ inputs.imageTag }}"
          title: "promote(prod): ${{ inputs.imageTag }}"
          body: "Promotes the exact image set already validated in development."
          labels: deployment,production
