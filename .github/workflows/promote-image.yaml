name: promote-image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      imageTag:
        description: Immutable image tag (git SHA)
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update tag in environment values
        run: |
          ENV="${{ github.event.inputs.environment }}"
          TAG="${{ github.event.inputs.imageTag }}"
          FILE="environments/${ENV}/values.yaml"
          sed -i "s/^  tag: .*/  tag: \"${TAG}\"/" "${FILE}"
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add environments/
          git commit -m "promote(${{ github.event.inputs.environment }}): ${{ github.event.inputs.imageTag }}" || echo "No changes"
          git push
