apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-cluster-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ChichiAgha/banking-gitops.git
    targetRevision: main
    path: platform/kafka-prod
    directory:
      recurse: true
  destination:
    name: banking-prod
    namespace: banking-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
