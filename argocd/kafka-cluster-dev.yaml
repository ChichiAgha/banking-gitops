apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-cluster-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ChichiAgha/banking-gitops.git
    targetRevision: main
    path: platform/kafka-dev
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: banking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
