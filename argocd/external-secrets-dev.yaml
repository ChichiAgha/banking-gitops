apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.9.0
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::716969407191:role/banking-dev-external-secrets-irsa
        extraObjects:
          - apiVersion: external-secrets.io/v1
            kind: ClusterSecretStore
            metadata:
              name: aws-secretsmanager
            spec:
              provider:
                aws:
                  service: SecretsManager
                  region: eu-west-2
                  auth:
                    jwt:
                      serviceAccountRef:
                        name: external-secrets
                        namespace: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
