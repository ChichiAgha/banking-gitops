apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-prod
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/<org>/<app-or-deploy-repo>.git
      targetRevision: main
      path: deploy/helm/banking-app
      helm:
        valueFiles:
          - values.yaml
          - $values/environments/prod/values.yaml
    - repoURL: https://github.com/<org>/<gitops-repo>.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: banking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
