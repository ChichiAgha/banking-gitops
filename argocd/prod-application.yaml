apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-prod
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/ChichiAgha/banking-gitops.git
      targetRevision: main
      path: deploy/helm/banking-app
      helm:
        valueFiles:
          - values.yaml
          - $values/environments/prod/values.yaml
    - repoURL: https://github.com/ChichiAgha/banking-gitops.git
      targetRevision: main
      ref: values
  destination:
    name: banking-prod
    namespace: banking-prod
