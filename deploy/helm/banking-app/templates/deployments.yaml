---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: banking-frontend
  template:
    metadata:
      labels:
        app: banking-frontend
      annotations:
        checksum/frontend-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: banking-frontend
          image: "{{ .Values.images.frontend }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: USER_SERVICE_HOST
              value: {{ .Values.frontendProxy.userServiceHost | quote }}
            - name: USER_SERVICE_PORT
              value: {{ .Values.service.userServicePort | quote }}
            - name: TRANSACTION_SERVICE_HOST
              value: {{ .Values.frontendProxy.transactionServiceHost | quote }}
            - name: TRANSACTION_SERVICE_PORT
              value: {{ .Values.service.transactionServicePort | quote }}
            - name: ACTIVITY_SERVICE_HOST
              value: {{ .Values.frontendProxy.activityServiceHost | quote }}
            - name: ACTIVITY_SERVICE_PORT
              value: {{ .Values.service.activityServicePort | quote }}
          volumeMounts:
            - name: frontend-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
            - name: frontend-config
              mountPath: /etc/nginx/proxy_params
              subPath: proxy_params
              readOnly: true
          ports:
            - containerPort: {{ .Values.service.frontendPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.frontendPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources.frontend | indent 12 }}
      volumes:
        - name: frontend-config
          configMap:
            name: banking-frontend-config
