{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-frontend
  namespace: {{ .Values.namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme }}
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api/usersvc
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: {{ .Values.service.userServicePort }}
          - path: /api/txsvc
            pathType: Prefix
            backend:
              service:
                name: transaction-service
                port:
                  number: {{ .Values.service.transactionServicePort }}
          - path: /api/activitysvc
            pathType: Prefix
            backend:
              service:
                name: activity-service
                port:
                  number: {{ .Values.service.activityServicePort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: banking-frontend
                port:
                  number: {{ .Values.service.frontendPort }}
{{- end }}
