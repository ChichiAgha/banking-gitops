{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banking-runtime-secrets
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRefName }}
    kind: {{ .Values.externalSecrets.secretStoreRefKind }}
  target:
    name: {{ .Values.externalSecrets.targetSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ required "externalSecrets.databaseHost is required" .Values.externalSecrets.databaseHost }}:{{ .Values.externalSecrets.databasePort }}/{{ .Values.externalSecrets.databaseName }}'
        SPRING_DATASOURCE_URL: 'jdbc:postgresql://{{ required "externalSecrets.databaseHost is required" .Values.externalSecrets.databaseHost }}:{{ .Values.externalSecrets.databasePort }}/{{ .Values.externalSecrets.databaseName }}'
        SPRING_DATASOURCE_USERNAME: '{{ `{{ .username }}` }}'
        SPRING_DATASOURCE_PASSWORD: '{{ `{{ .password }}` }}'
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "externalSecrets.awsSecretPath must be the Terraform rds_master_secret_arn output" .Values.externalSecrets.awsSecretPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ required "externalSecrets.awsSecretPath must be the Terraform rds_master_secret_arn output" .Values.externalSecrets.awsSecretPath }}
        property: password
{{- end }}
