{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banking-runtime-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRefName }}
    kind: {{ .Values.externalSecrets.secretStoreRefKind }}
  target:
    name: {{ .Values.externalSecrets.targetSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ `{{ .host }}` }}:{{ `{{ .port }}` }}/{{ .Values.externalSecrets.databaseName }}'
        SPRING_DATASOURCE_URL: 'jdbc:postgresql://{{ `{{ .host }}` }}:{{ `{{ .port }}` }}/{{ .Values.externalSecrets.databaseName }}'
        SPRING_DATASOURCE_USERNAME: '{{ `{{ .username }}` }}'
        SPRING_DATASOURCE_PASSWORD: '{{ `{{ .password }}` }}'
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "externalSecrets.awsSecretPath must be the Terraform rds_master_secret_arn output" .Values.externalSecrets.awsSecretPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ required "externalSecrets.awsSecretPath must be the Terraform rds_master_secret_arn output" .Values.externalSecrets.awsSecretPath }}
        property: password
    - secretKey: host
      remoteRef:
        key: {{ required "externalSecrets.awsSecretPath must be the Terraform rds_master_secret_arn output" .Values.externalSecrets.awsSecretPath }}
        property: host
    - secretKey: port
      remoteRef:
        key: {{ required "externalSecrets.awsSecretPath must be the Terraform rds_master_secret_arn output" .Values.externalSecrets.awsSecretPath }}
        property: port
{{- end }}
