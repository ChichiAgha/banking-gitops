namespace: banking

images:
  userService: "bank-user-service"
  transactionService: "bank-transaction-service"
  activityService: "bank-activity-service"
  frontend: "bank-frontend"
  tag: "latest"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: alb
  host: banking.dev.internal
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip

config:
  frontendOrigins: "https://banking.dev.internal"
  springJpaHibernateDdlAuto: "update"
  redisHost: "redis"
  redisPort: "6379"
  kafkaBootstrapServers: "kafka:29092"
  springDatasourceUrl: "jdbc:postgresql://postgres:5432/bankingdb"

externalSecrets:
  enabled: true
  secretStoreRefName: aws-secretsmanager
  secretStoreRefKind: ClusterSecretStore
  awsSecretPath: /bank/dev/app
  targetSecretName: banking-runtime-secrets

service:
  userServicePort: 8000
  transactionServicePort: 8080
  activityServicePort: 8001
  frontendPort: 8080

resources:
  userService:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  transactionService:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 750m
      memory: 768Mi
  activityService:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

observability:
  prometheus:
    enabled: true
    scrapeInterval: 30s
    serviceMonitorLabels:
      release: kube-prometheus-stack
    ruleLabels:
      release: kube-prometheus-stack
  datadog:
    enabled: true
    environment: dev
    serviceVersion: "1.0.0"

frontendConfig:
  userApiUrl: /api/usersvc
  transactionApiUrl: /api/txsvc
  activityApiUrl: /api/activitysvc

frontendProxy:
  userServiceHost: user-service
  transactionServiceHost: transaction-service
  activityServiceHost: activity-service
